<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIEVAL | Evaluator Hub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "on-error-container": "#ffb2b9",
                    "secondary": "#64748b",
                    "primary-fixed": "#334155",
                    "on-primary-fixed": "#f8fafc",
                    "tertiary-container": "#1e293b",
                    "on-secondary-fixed": "#0f172a",
                    "on-secondary": "#1e293b",
                    "secondary-container": "#334155",
                    "on-primary-fixed-variant": "#94a3b8",
                    "surface-bright": "#1e293b",
                    "on-primary-container": "#f1f5f9",
                    "surface-container-lowest": "#020617",
                    "outline": "#475569",
                    "on-error": "#490013",
                    "inverse-on-surface": "#94a3b8",
                    "primary-container": "#1e293b",
                    "surface-dim": "#020617",
                    "outline-variant": "#334155",
                    "on-secondary-fixed-variant": "#475569",
                    "on-tertiary-container": "#f1f5f9",
                    "on-background": "#f8fafc",
                    "on-surface-variant": "#94a3b8",
                    "surface-container-high": "#0f172a",
                    "on-secondary-container": "#f1f5f9",
                    "on-tertiary": "#f1f5f9",
                    "inverse-surface": "#f8fafc",
                    "inverse-primary": "#3b82f6",
                    "surface-variant": "#0f172a",
                    "surface": "#020617",
                    "primary-dim": "#3b82f6",
                    "on-tertiary-fixed-variant": "#475569",
                    "tertiary": "#94a3b8",
                    "error-container": "#a70138",
                    "on-surface": "#f1f5f9",
                    "error": "#ef4444",
                    "secondary-fixed-dim": "#475569",
                    "background": "#020617",
                    "secondary-fixed": "#94a3b8",
                    "secondary-dim": "#64748b",
                    "surface-container-highest": "#1e293b",
                    "surface-container": "#0f172a",
                    "on-primary": "#ffffff",
                    "primary": "#3b82f6",
                    "surface-tint": "#3b82f6",
                    "error-dim": "#d73357",
                    "tertiary-dim": "#64748b",
                    "tertiary-fixed-dim": "#64748b",
                    "tertiary-fixed": "#94a3b8",
                    "on-tertiary-fixed": "#0f172a",
                    "primary-fixed-dim": "#60a5fa",
                    "surface-container-low": "#020617"
                },
                fontFamily: {
                    "headline": ["Space Grotesk"],
                    "body": ["Inter"],
                    "label": ["Inter"]
                },
                borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
                keyframes: {
                    'fade-in': { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                    'slide-in-from-top': { '0%': { transform: 'translateY(-1rem)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                    'slide-in-from-bottom': { '0%': { transform: 'translateY(2rem)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                    'zoom-in': { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
                    'shake': { '0%, 100%': { transform: 'translateX(0)' }, '25%': { transform: 'translateX(-5px)' }, '75%': { transform: 'translateX(5px)' } }
                },
                animation: {
                    'in': 'fade-in 0.5s ease-out forwards',
                    'fade-in': 'fade-in 0.7s ease-out forwards',
                    'slide-in-from-top-4': 'slide-in-from-top 0.7s ease-out forwards',
                    'slide-in-from-bottom-8': 'slide-in-from-bottom 0.7s ease-out forwards',
                    'slide-in-from-bottom-12': 'slide-in-from-bottom 1s ease-out forwards',
                    'zoom-in': 'zoom-in 0.5s ease-out forwards',
                    'shake': 'shake 0.5s ease-in-out'
                }
            }
        }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-headline { font-family: 'Space Grotesk', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
    .glass-panel { backdrop-filter: blur(12px); }
  </style>
  <script type="module" src="/index.tsx"></script>
</head>

<body class="bg-slate-100 dark:bg-slate-900">
  <div id="root"></div>
</body>
